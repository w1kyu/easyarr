name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: VPN server list matches Gluetun
        run: node scripts/gen-vpn-servers.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  vpn-wrapper:
    name: VPN wrapper (shellcheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x -s sh vpn/rootfs/easyarr/*.sh vpn/rootfs/easyarr/iptables-guard vpn/test/lib.test.sh && shellcheck vpn/test/smoke.sh dev/*.sh
      - name: Unit tests (dash)
        run: dash vpn/test/lib.test.sh
      - name: Unit tests (busybox ash, as in the image)
        run: docker run --rm -v "$PWD:/w:ro" -w /w busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4 sh vpn/test/lib.test.sh

  e2e:
    name: Wizard e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  recyclarr:
    name: Recyclarr profiles (real Recyclarr, Radarr, Sonarr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: dev/recyclarr-test.sh
