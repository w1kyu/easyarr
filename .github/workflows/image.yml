name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'dashboard/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'LICENSE'
      - 'NOTICE.md'
      - '.dockerignore'
      - 'docs/*.md'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'docs/*.md'
      - 'pnpm-lock.yaml'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ghcr.io/w1kyu/easyarr (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/w1kyu/easyarr
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Version string
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "value=0.0.0-sha.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: dashboard/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64)
        run: |
          docker buildx build --load --platform linux/amd64 -f dashboard/Dockerfile -t easyarr:test \
            --build-arg VERSION=${{ steps.version.outputs.value }} --cache-from type=gha .
          docker run -d --name ea -p 3000:3000 easyarr:test
          for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done || true
          docker logs ea
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/licenses/umbrelOS-LICENSE.md | grep -q 'PolyForm Noncommercial'
          # In-app help pages are bundled (docs/ must be in the build context).
          docker exec ea sh -c "grep -rl 'Usenet 101' /app/web/assets" >/dev/null
          mkdir -p /tmp/t/data /tmp/t/appdata
          docker run --rm -u 0:0 -v /tmp/t/data:/data -v /tmp/t/appdata:/appdata easyarr:test init
          docker run --rm -u 0:0 -v /tmp/t/data:/data -v /tmp/t/appdata:/appdata easyarr:test init | grep -q 'everything already in place'
          sudo test -d /tmp/t/data/media/movies
          docker rm -f ea
