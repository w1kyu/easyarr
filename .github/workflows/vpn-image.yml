name: VPN image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'vpn/**'
      - 'LICENSE'
      - '.github/workflows/vpn-image.yml'
  pull_request:
    paths:
      - 'vpn/**'
      - '.github/workflows/vpn-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vpn-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + kill-switch smoke test ghcr.io/w1kyu/easyarr-vpn (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Version string
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "value=0.0.0-sha.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      # Test first, push only what passed.
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: vpn/Dockerfile
          platforms: linux/amd64
          load: true
          tags: easyarr-vpn:test
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=vpn
          cache-to: type=gha,mode=max,scope=vpn
      - name: Kill-switch smoke test
        run: vpn/test/smoke.sh easyarr-vpn:test
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/w1kyu/easyarr-vpn
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: vpn/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=vpn
          cache-to: type=gha,mode=max,scope=vpn
